name: Validate repository

on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9"

      - name: Run tests
        run: python -m pytest -q

      - name: Validate Python and active Markdown
        run: python scripts/validate_repo.py --imports

      - name: Audit established documentation profiles
        run: |
          python scripts/audit_documentation.py --profile batch-1 --fail-on-missing --summary
          python scripts/audit_documentation.py --profile batch-2a --fail-on-missing --summary
          python scripts/audit_documentation.py --profile batch-2b --fail-on-missing --summary

      - name: Audit system-design content debt
        run: >-
          python scripts/audit_system_design.py
          --max-structural-filler 27
          --max-copied-capacity 134
